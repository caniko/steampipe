[workspace]
members = ["crates/cluster-guard-prompt"]
resolver = "3"

[package]
name = "steampipe"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.88"

[features]
default = []
fixture-tools = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "cluster-ctl"
path = "src/bin/cluster-ctl.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "=0.4.2"
memory-admission = { version = "*", default-features = false, features = ["async"] }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "io-std",
    "io-util",
    "sync",
    "time",
] }
toml = "1"
rmcp = { version = "0.17", features = ["server", "transport-io"] }
schemars = "1"
steam-vent = { git = "https://github.com/caniko/steam-vent.git", branch = "integration" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
vnc = "0.4"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
serial_test = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
clone_on_copy = "warn"
collapsible_if = "warn"
collapsible_str_replace = "warn"
if_same_then_else = "warn"
manual_find = "warn"
new_without_default = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_get_then_check = "warn"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.release-fast]
inherits = "release"
panic = "abort"
strip = true
