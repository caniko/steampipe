[workspace]

[package]
name = "steampipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[[bin]]
name = "cluster-ctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "6.0"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "io-std",
    "io-util",
    "time",
] }
toml = "1"
rmcp = { version = "0.17", features = ["server", "transport-io"] }
schemars = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
clone_on_copy = "warn"
collapsible_if = "warn"
collapsible_str_replace = "warn"
if_same_then_else = "warn"
manual_find = "warn"
new_without_default = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_get_then_check = "warn"
