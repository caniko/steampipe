<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="{{ config.base_url }}" class="nav-brand">{{ config.title }}</a>
      <div class="nav-links">
        <a href="{{ config.base_url }}/docs/">Documentation</a>
        <a href="{{ config.extra.repo_url }}">Source</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>{{ config.title }} is open-source software licensed under {{ config.extra.license }}</p>
      <p><a href="{{ config.extra.repo_url }}">Codeberg</a></p>
    </div>
  </footer>
</body>
</html>
