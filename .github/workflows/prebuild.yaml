# Generated by simit. Manual edits will be reported as ci=drift.
# Required repository secret:
# - ATTIC_TOKEN: Attic token for trusted push and release publication.
name: Native Nix prebuild

on:
  push:
    branches:
      - "trunk"
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        required: false
        type: boolean
        default: false
    secrets:
      attic_token:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-prebuild
  cancel-in-progress: ${{ !inputs.release && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: ${{ inputs.release }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${FORGEJO_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${FORGEJO_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          TAG="$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          git_fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"
          git verify-tag "$TAG"
          signed_tag_name="$(git cat-file tag "refs/tags/$TAG" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$TAG" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          event_sha="${GITHUB_SHA:-${FORGE_SHA:-${FORGEJO_SHA:-}}}"
          test -n "$event_sha" && test "$validated_sha" = "$event_sha" && test "$checkout_sha" = "$event_sha" || { echo "Signed tag commit does not match the immutable event checkout" >&2; exit 1; }
          git worktree add --detach "$tag_worktree" "$validated_sha"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          git checkout --detach "$validated_sha"
          { printf 'TAG=%s\n' "$TAG"; printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
      - name: Verify runner system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"
      - name: Build native Nix outputs
        run: |
          set -euo pipefail
          mkdir -p .simit-prebuild
          nix build '.#packages.x86_64-linux.cluster-ctl' --out-link '.simit-prebuild/ci-0' --print-build-logs --max-jobs 1 --cores 2
          nix build '.#packages.x86_64-linux.cluster-guard-prompt' --out-link '.simit-prebuild/ci-1' --print-build-logs --max-jobs 1 --cores 2
      - name: Publish flake inputs to Attic
        if: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (inputs.release && github.event_name != 'pull_request') }}
        env:
          ATTIC_TOKEN: ${{ inputs.release && secrets.attic_token || secrets.ATTIC_TOKEN }}
          HARBOR_ATTIC_MANIFEST: attic-paths.txt
        run: nix run '.#push-flake-inputs'
      - name: Upload flake input manifest
        if: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (inputs.release && github.event_name != 'pull_request') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-inputs-${{ matrix.system }}
          path: attic-paths.txt
          if-no-files-found: error
          retention-days: 7
