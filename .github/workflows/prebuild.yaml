# Generated by simit. Manual edits will be reported as ci=drift.
# Required repository secret:
# - ATTIC_TOKEN: Attic token for trusted push and release publication.
name: Native Nix prebuild

on:
  push:
    branches:
      - "trunk"
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-prebuild
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Verify runner system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"
      - name: Build native Nix outputs
        run: |
          set -euo pipefail
          mkdir -p .simit-prebuild
          nix build '.#packages.x86_64-linux.cluster-ctl' --out-link '.simit-prebuild/ci-0' --print-build-logs --max-jobs 1 --cores 2
          nix build '.#packages.x86_64-linux.cluster-guard-prompt' --out-link '.simit-prebuild/ci-1' --print-build-logs --max-jobs 1 --cores 2
      - name: Publish flake inputs to Attic
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          HARBOR_ATTIC_MANIFEST: attic-paths.txt
        run: nix run '.#push-flake-inputs'
      - name: Upload flake input manifest
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-inputs-${{ matrix.system }}
          path: attic-paths.txt
          if-no-files-found: error
          retention-days: 7
