# Generated by simit. Manual edits will be reported as ci=drift.
name: "CI (steampipe)"

on:
  push:
    branches:
      - "trunk"
      - "simit/update/**"
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type == 'tag' && github.ref || format('refs/heads/{0}', github.event.pull_request.head.ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  test:
    name: "steampipe / test"
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Test
        run: nix develop -c cargo test -p steampipe

      - name: Test no default features
        run: nix develop -c cargo test -p steampipe --no-default-features

      - name: Clippy
        run: nix develop -c cargo clippy -p steampipe --all-targets -- --deny warnings

      - name: Clippy no default features
        run: nix develop -c cargo clippy -p steampipe --all-targets --no-default-features -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package -p steampipe --allow-dirty --list
